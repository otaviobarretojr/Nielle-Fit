<!doctype html><html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="strict-origin-when-cross-origin"><meta name="theme-color" content="#10254a">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<title>Nielle Fit • v6</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f3f5fa;color:#10254a}button,input{font:inherit}.wrap{max-width:720px;margin:auto}
.hero{background:linear-gradient(135deg,#071d43,#244b82);color:#fff;padding:26px 18px}.hero h1{margin:0;font-size:30px}.hero p{margin:6px 0 0;opacity:.88}.build{margin-top:10px;font-size:11px;opacity:.65}
.home{padding:18px}.intro,.choice,.card{background:#fff;border-radius:18px;box-shadow:0 5px 18px #10254a12}.intro{padding:18px}.intro h2{margin:0 0 5px}.intro p{margin:0;color:#68758c;line-height:1.45}
.choice{width:100%;border:0;text-align:left;padding:18px;margin:12px 0;color:#10254a}.choice strong{display:block;font-size:22px}.choice span{color:#68758c}.choice em{display:block;margin-top:8px;color:#6b5bd2;font-style:normal;font-weight:800}
#session,#summary{display:none}.top{position:sticky;top:0;z-index:5;background:#f3f5faf2;backdrop-filter:blur(8px);padding:12px 16px;border-bottom:1px solid #e1e6ef}.row{display:flex;align-items:center;gap:10px}.back{border:0;background:#fff;border-radius:12px;padding:10px 12px;font-weight:900}.title{font-weight:900;flex:1}.counter{font-weight:800}
.progress{height:8px;background:#dce3ee;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;background:#6b5bd2;width:20%;transition:.25s}.content{padding:16px 16px 105px}
.card{overflow:hidden}.head{display:flex;gap:12px;align-items:center;padding:16px}.num{background:#6b5bd2;color:#fff;padding:8px 12px;border-radius:11px;font-weight:900}.head h2{font-size:20px;margin:0}.head small{color:#6d7890}
.player{aspect-ratio:16/9;background:#0a1730;position:relative}.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.source{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 14px;background:#f8f9fc;font-size:11px;color:#69758a}.source a{color:#244b82;font-weight:700;text-decoration:none}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:14px 14px 0}.meta>div,.meta label{background:#f5f3ff;border-radius:12px;padding:10px}.meta b{display:block;font-size:10px;color:#6754b5;margin-bottom:2px}.meta span{font-weight:800}.meta label{grid-column:1/-1}.meta input{width:100%;border:0;background:transparent;outline:0;font-weight:800;color:#10254a}
.tip,.alt{margin:12px 14px 0;padding:12px;border-radius:12px;font-size:14px;line-height:1.45}.tip{background:#f7f9fc}.alt{background:#eef7ff;border:1px solid #d8e9f8}.alt b{color:#244b82}
.actions{position:fixed;left:0;right:0;bottom:0;z-index:6;background:#fff;padding:12px 16px max(12px,env(safe-area-inset-bottom));box-shadow:0 -4px 18px #10254a18}.actions .inside{max-width:688px;margin:auto;display:grid;grid-template-columns:auto 1fr;gap:10px}.prev{border:0;border-radius:14px;padding:14px 16px;background:#eef1f6;color:#10254a;font-weight:800}.next{border:0;border-radius:14px;padding:14px;background:#6b5bd2;color:#fff;font-weight:900}
.summary{text-align:center;padding:48px 20px}.summary .check{font-size:60px}.summary h2{font-size:28px;margin:8px 0}.summary p{color:#68758c}.summary button{border:0;background:#10254a;color:#fff;padding:14px 24px;border-radius:14px;font-weight:800}
@media(max-width:430px){.hero h1{font-size:28px}.title{font-size:14px}}
</style></head><body>
<section class="hero"><div class="wrap"><h1>NIELLE FIT</h1><p>Treino de adaptação • 3x por semana</p><div class="build">BUILD 2026-08-14 • PLAYER V6</div></div></section>
<main id="home" class="home wrap"><div class="intro"><h2>Qual é o treino de hoje?</h2><p>Execução primeiro. Carga leve a moderada e descanso de 60–90 segundos.</p></div>
<button class="choice" onclick="start('A')"><strong>Treino A</strong><span>Superiores + Core</span><em>Iniciar →</em></button>
<button class="choice" onclick="start('B')"><strong>Treino B</strong><span>Inferiores + Glúteos</span><em>Iniciar →</em></button>
<button class="choice" onclick="start('C')"><strong>Treino C</strong><span>Corpo todo</span><em>Iniciar →</em></button></main>
<section id="session"><div class="top"><div class="wrap"><div class="row"><button class="back" onclick="goHome()">←</button><div class="title" id="title"></div><span class="counter" id="counter"></span></div><div class="progress"><div class="bar" id="bar"></div></div></div></div><div id="content" class="content wrap"></div><div class="actions"><div class="inside"><button class="prev" id="prev" onclick="previous()">←</button><button class="next" id="next" onclick="completeNext()">Concluir e próximo →</button></div></div></section>
<section id="summary" class="summary wrap"><div class="check">✓</div><h2>Treino concluído!</h2><p id="summaryText"></p><button onclick="goHome()">Voltar aos treinos</button></section>
<script>
const W={"A":[["Puxada na frente","Costas","2–3","10–12","BOW9my4J_ek","Peito aberto; puxe a barra para a parte alta do peito, levando os cotovelos para baixo. Evite jogar o tronco para trás e controle a volta.","Puxada articulada com pegada neutra."],["Supino na máquina","Peito","2–3","10–12","qmSOsrheLEg","Mantenha as costas apoiadas. Empurre sem travar os cotovelos e retorne de forma controlada.","Peck deck/crucifixo na máquina com carga leve."],["Remada baixa sentada","Costas","2–3","10–12","ldC6IbrxOa4","Mantenha a coluna neutra. Puxe em direção ao abdômen, leve os cotovelos para trás e evite balançar o tronco.","Remada articulada sentada com apoio para o peito."],["Elevação lateral","Ombros","2–3","10–12","Tt8m9zlvNx8","Use carga leve. Cotovelos discretamente flexionados; eleve os braços com controle até aproximadamente a linha dos ombros.","Elevação lateral na máquina."],["Prancha isométrica","Abdômen","2–3","20–30 s","bi5dvCkPBVA","Apoie antebraços e pés, contraia abdômen e glúteos e mantenha cabeça, tronco e quadril alinhados.","Prancha com os joelhos apoiados."]],"B":[["Leg press 45°","Pernas e glúteos","2–3","10–12","waAxlYvtCcI","Mantenha costas e quadril apoiados. Joelhos acompanham a direção dos pés; empurre sem travá-los no topo.","Leg press horizontal."],["Cadeira extensora","Quadríceps","2–3","10–12","pJZXbaF-MCM","Alinhe o joelho ao eixo da máquina. Estenda com controle e evite impulso com o tronco.","Extensora unilateral com carga leve."],["Cadeira flexora","Posterior de coxa","2–3","10–12","1wvGiK1C67E","Mantenha o quadril apoiado. Flexione os joelhos sem tirar o corpo do banco e controle a volta.","Mesa flexora."],["Abdução de quadril","Glúteos","2–3","10–12","50qHGus1TZk","Mantenha as costas apoiadas. Abra as pernas sem impulso, faça uma breve pausa e retorne devagar.","Abdução em pé no cabo com carga leve."],["Panturrilha em pé","Panturrilhas","2–3","12–15","mx7KyrtL8NI","Eleve bem os calcanhares, faça uma breve pausa no alto e desça de forma controlada.","Panturrilha sentada."]],"C":[["Agachamento no Smith","Pernas e glúteos","2–3","10–12","uCT5wfQIQpk","Pés firmes e joelhos alinhados. Desça apenas até onde mantém postura estável e retorne pressionando o chão.","Agachamento para banco com peso corporal."],["Desenvolvimento","Ombros","2–3","10–12","dxQCyYawS-0","Mantenha as costas apoiadas. Empurre acima da cabeça sem arquear excessivamente a lombar e retorne devagar.","Desenvolvimento na máquina com carga leve."],["Puxada alta com triângulo","Costas","2–3","10–12","uAnrJBnxrZ0","Mantenha o peito aberto. Puxe o triângulo em direção à parte alta do peito e controle totalmente a subida.","Puxada articulada com pegada neutra."],["Glúteo na máquina","Glúteos","2–3","10–12 cada perna","pdk0deKsRLo","Mantenha tronco e pelve estáveis. Empurre a plataforma para trás usando o quadril e retorne lentamente.","Extensão de quadril no cabo com carga leve."],["Abdominal na máquina","Abdômen","2–3","12–15","1l0yf6eWh3Y","Faça a flexão usando o abdômen. Evite puxar o pescoço, solte o ar ao contrair e controle o retorno.","Abdominal curto no solo."]]};const TITLES={A:'Superiores + Core',B:'Inferiores + Glúteos',C:'Corpo todo'};let active='',idx=0,started=0,done=0;
function yt(id){return 'https://www.youtube.com/embed/'+id+'?rel=0&playsinline=1&hl=pt-BR&cc_lang_pref=pt&cc_load_policy=1'}
function start(w){active=w;idx=0;done=0;started=Date.now();home.style.display='none';summary.style.display='none';session.style.display='block';title.textContent='Treino '+w+' • '+TITLES[w];render();scrollTo(0,0)}
function render(){const x=W[active][idx],key=active+'-'+idx;counter.textContent=(idx+1)+'/5';bar.style.width=((idx+1)*20)+'%';prev.style.visibility=idx===0?'hidden':'visible';next.textContent=idx===4?'Concluir treino ✓':'Concluir e próximo →';content.innerHTML=`<article class="card"><div class="head"><span class="num">${idx+1}</span><div><h2>${x[0]}</h2><small>${x[1]}</small></div></div><div class="player"><iframe src="${yt(x[4])}" title="${x[0]}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="source"><span>Vídeo demonstrativo • YouTube</span><a href="https://www.youtube.com/watch?v=${x[4]}" target="_blank" rel="noopener">Abrir no YouTube ↗</a></div><div class="meta"><div><b>SÉRIES</b><span>${x[2]}</span></div><div><b>REPETIÇÕES</b><span>${x[3]}</span></div><label><b>CARGA</b><input id="load" inputmode="decimal" placeholder="kg" value="${localStorage.getItem('nielle-load-'+key)||''}"></label></div><div class="tip"><b>Como executar</b><br>${x[5]}</div><div class="alt"><b>↔ Alternativa</b><br>${x[6]}</div></article>`;document.getElementById('load').onchange=e=>localStorage.setItem('nielle-load-'+key,e.target.value);}
function saveLoad(){const e=document.getElementById('load');if(e)localStorage.setItem('nielle-load-'+active+'-'+idx,e.value)}
function completeNext(){saveLoad();done=Math.max(done,idx+1);if(idx<4){idx++;render();scrollTo(0,0)}else finish()}
function previous(){saveLoad();if(idx>0){idx--;render();scrollTo(0,0)}}
function finish(){const m=Math.max(1,Math.round((Date.now()-started)/60000));session.style.display='none';summary.style.display='block';summaryText.textContent='Treino '+active+' • 5 de 5 exercícios • '+m+' min';scrollTo(0,0)}
function goHome(){session.style.display='none';summary.style.display='none';home.style.display='block';content.innerHTML='';active='';idx=0;scrollTo(0,0)}
</script></body></html>
