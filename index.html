<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10254a"><title>Nielle Fit</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f5fa;color:#10254a}button,input{font:inherit}.hero{background:linear-gradient(135deg,#071d43,#244b82);color:#fff;padding:26px 18px}.wrap{max-width:760px;margin:auto}.home,.content{padding:18px}.box,.btn,.ex{background:#fff;border-radius:18px;box-shadow:0 5px 18px #10254a12}.box,.btn{padding:18px}.btn{display:block;width:100%;border:0;text-align:left;margin:12px 0;color:#10254a}.btn strong{font-size:22px}.btn span{display:block;color:#68758c}.btn em{display:block;color:#6b5bd2;font-style:normal;font-weight:800;margin-top:8px}#session,#summary{display:none}.top{position:sticky;top:0;z-index:5;background:#f3f5faee;padding:12px 16px}.row{display:flex;gap:10px;align-items:center}.back{border:0;background:#fff;padding:10px;border-radius:10px}.title{font-weight:900;flex:1}.progress{height:8px;background:#dde3ed;border-radius:9px;margin-top:10px;overflow:hidden}.bar{height:100%;background:#6b5bd2;width:0}.content{padding-bottom:90px}.ex{overflow:hidden;margin-bottom:15px}.head{display:flex;gap:12px;align-items:center;padding:16px}.num{background:#6b5bd2;color:#fff;padding:8px 12px;border-radius:10px;font-weight:900}.head h2{font-size:19px;margin:0}.head small{color:#6d7890}.player{background:#09182f;aspect-ratio:16/9}.player iframe{display:block;width:100%;height:100%;border:0}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px}.meta>*{background:#f5f3ff;padding:10px;border-radius:12px}.meta b{display:block;font-size:10px;color:#6754b5}.meta input{width:100%;border:0;background:transparent;outline:0}.tip,.alt{margin:0 14px 14px;padding:12px;border-radius:12px;font-size:14px;line-height:1.45}.tip{background:#f7f9fc}.alt{background:#eef7ff;border:1px solid #d8e9f8}.done{margin:0 14px 16px;width:calc(100% - 28px);border:0;border-radius:12px;background:#10254a;color:#fff;padding:14px;font-weight:800}.done.ok{background:#23845d}.finish{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px;z-index:7}.finish button{width:100%;max-width:728px;display:block;margin:auto;border:0;background:#6b5bd2;color:#fff;padding:15px;border-radius:14px;font-weight:900}.summary{text-align:center;padding:50px 20px}.summary button{border:0;background:#10254a;color:#fff;padding:14px 22px;border-radius:14px}@media(max-width:520px){.meta{grid-template-columns:1fr 1fr}.meta label{grid-column:1/-1}}</style></head><body><section class="hero"><div class="wrap"><h1>NIELLE FIT</h1><p>Treino de adaptação • 3x por semana</p></div></section><main id="home" class="home wrap"><div class="box"><h2>Qual é o treino de hoje?</h2><p>Carga leve a moderada • descanso 60–90 s • prioridade para execução correta.</p></div><button class="btn" onclick="start('A')"><strong>Treino A</strong><span>Superiores + Core</span><em>Iniciar →</em></button><button class="btn" onclick="start('B')"><strong>Treino B</strong><span>Inferiores + Glúteos</span><em>Iniciar →</em></button><button class="btn" onclick="start('C')"><strong>Treino C</strong><span>Corpo todo</span><em>Iniciar →</em></button></main><section id="session"><div class="top"><div class="wrap"><div class="row"><button class="back" onclick="goHome()">←</button><div id="ttl" class="title"></div><span id="cnt">0/5</span></div><div class="progress"><div id="bar" class="bar"></div></div></div></div><div id="list" class="content wrap"></div><div class="finish"><button onclick="finish()">Encerrar treino</button></div></section><section id="summary" class="summary wrap"><div style="font-size:60px">✓</div><h2>Treino concluído!</h2><p id="sum"></p><button onclick="goHome()">Voltar aos treinos</button></section><script>const W={A:[['Puxada na frente','Costas','2–3','10–12','JiG_aiQ5TIY','Peito aberto; puxe a barra em direção ao peitoral sem balançar o tronco e controle a volta.','Puxada articulada com pegada neutra.'],['Supino na máquina','Peito','2–3','10–12','qmSOsrheLEg','Costas apoiadas; empurre sem travar os cotovelos e controle a volta.','Peck deck com carga leve.'],['Remada baixa sentada','Costas','2–3','10–12','ldC6IbrxOa4','Coluna neutra; puxe ao abdômen sem balançar o tronco.','Remada articulada com apoio para o peito.'],['Elevação lateral','Ombros','2–3','10–12','dGL87RLG7H0','Carga leve; cotovelos levemente flexionados e subida controlada até a linha dos ombros.','Elevação lateral na máquina.'],['Prancha isométrica','Abdômen','2–3','20–30 s','LxXXhWZgoL8','Contraia abdômen e glúteos e mantenha o corpo alinhado.','Prancha com joelhos apoiados.']],B:[['Leg press 45°','Pernas e glúteos','2–3','10–12','EiltwxxREDc','Costas e quadril apoiados; joelhos acompanham os pés e não travam no topo.','Leg press horizontal.'],['Cadeira extensora','Quadríceps','2–3','10–12','_ODbNIbo29M','Alinhe o joelho ao eixo e estenda sem impulso.','Extensora unilateral leve.'],['Cadeira flexora','Posterior de coxa','2–3','10–12','Q5i-dGzEF3Y','Mantenha o quadril apoiado e controle ida e volta.','Mesa flexora.'],['Abdução de quadril','Glúteos','2–3','10–12','G_uC7h01XRs','Costas apoiadas; abra sem impulso e retorne lentamente.','Abdução em pé no cabo.'],['Panturrilha em pé','Panturrilhas','2–3','12–15','fVGkOlkOrnA','Suba os calcanhares, pause e desça controlando.','Panturrilha sentada.']],C:[['Agachamento no Smith','Pernas e glúteos','2–3','10–12','G_uC7h01XRs','Pés firmes, joelhos alinhados e amplitude confortável.','Agachamento para banco.'],['Desenvolvimento','Ombros','2–3','10–12','DHjiP-n9Ukw','Costas apoiadas; empurre sem arquear excessivamente a lombar.','Desenvolvimento na máquina leve.'],['Puxada alta com triângulo','Costas','2–3','10–12','GjxRBJIOkJk','Peito aberto; puxe o triângulo e controle a subida.','Puxada articulada neutra.'],['Glúteo na máquina','Glúteos','2–3','10–12 cada perna','gt_dT7MQGPo','Mantenha tronco e pelve estáveis; mova pelo quadril.','Extensão de quadril no cabo.'],['Abdominal na máquina ou solo','Abdômen','2–3','12–15','LxXXhWZgoL8','Use o abdômen; evite puxar o pescoço e controle o retorno.','Abdominal curto no solo.']]};const T={A:'Superiores + Core',B:'Inferiores + Glúteos',C:'Corpo todo'};let a=null,t=0;const ORIGIN='https://otaviobarretojr.github.io';function embed(id){return 'https://www.youtube-nocookie.com/embed/'+id+'?playsinline=1&rel=0&hl=pt-BR&cc_lang_pref=pt&origin='+encodeURIComponent(ORIGIN)+'&widget_referrer='+encodeURIComponent(location.href)}function start(w){a=w;t=Date.now();home.style.display='none';summary.style.display='none';session.style.display='block';ttl.textContent='Treino '+w+' • '+T[w];list.innerHTML=W[w].map((x,i)=>`<article class="ex"><div class="head"><span class="num">${i+1}</span><div><h2>${x[0]}</h2><small>${x[1]}</small></div></div><div class="player"><iframe src="${embed(x[4])}" title="${x[0]}" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="meta"><div><b>SÉRIES</b>${x[2]}</div><div><b>REPETIÇÕES</b>${x[3]}</div><label><b>CARGA</b><input placeholder="kg" data-k="${w}-${i}"></label></div><div class="tip"><b>Como executar</b><br>${x[5]}</div><div class="alt"><b>↔ Alternativa</b><br>${x[6]}</div><button class="done" onclick="done(this)">Concluir exercício</button></article>`).join('');document.querySelectorAll('[data-k]').forEach(i=>{i.value=localStorage.getItem('load-'+i.dataset.k)||'';i.onchange=()=>localStorage.setItem('load-'+i.dataset.k,i.value)});upd();scrollTo(0,0)}function done(b){b.classList.toggle('ok');b.textContent=b.classList.contains('ok')?'✓ Concluído':'Concluir exercício';upd()}function upd(){let d=document.querySelectorAll('.done.ok').length;cnt.textContent=d+'/5';bar.style.width=d*20+'%'}function finish(){let d=document.querySelectorAll('.done.ok').length,m=Math.max(1,Math.round((Date.now()-t)/60000));session.style.display='none';summary.style.display='block';sum.textContent='Treino '+a+' • '+d+' de 5 exercícios • '+m+' min';scrollTo(0,0)}function goHome(){session.style.display='none';summary.style.display='none';home.style.display='block';list.innerHTML='';a=null;scrollTo(0,0)}</script></body></html>
