<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10254a"><title>Nielle Fit</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Arial;background:#f3f5fa;color:#10254a}button,input{font:inherit}.hero{background:linear-gradient(135deg,#071d43,#244b82);color:white;padding:28px 18px 24px}.wrap{max-width:760px;margin:auto}h1{margin:0;font-size:32px}.hero p{margin:5px 0 0;opacity:.82}.home{padding:18px}.intro,.workoutBtn,.exercise{background:white;border-radius:18px;box-shadow:0 5px 18px #10254a12}.intro{padding:18px}.intro h2{margin:0 0 6px}.intro p{margin:0;color:#65728a}.workouts{display:grid;gap:12px;margin-top:16px}.workoutBtn{border:0;padding:18px;text-align:left;color:#10254a}.workoutBtn strong{display:block;font-size:22px}.workoutBtn span{color:#66758d}.workoutBtn em{display:block;margin-top:9px;color:#6b5bd2;font-style:normal;font-weight:800}#session{display:none}.sessionHead{position:sticky;top:0;z-index:5;background:#f3f5faee;backdrop-filter:blur(10px);padding:12px 16px;border-bottom:1px solid #dfe4ee}.sessionRow{display:flex;align-items:center;gap:10px}.back{border:0;background:white;border-radius:12px;padding:10px 12px;font-weight:800}.sessionTitle{font-weight:900;flex:1}.progress{height:8px;background:#dde3ed;border-radius:20px;overflow:hidden;margin-top:10px}.bar{height:100%;width:0;background:#6b5bd2}.content{padding:10px 16px 100px}.exercise{margin:14px 0;overflow:hidden}.exTop{display:flex;align-items:center;gap:12px;padding:16px}.num{background:#6b5bd2;color:white;border-radius:11px;padding:8px 12px;font-weight:900}.exTop h2{font-size:19px;margin:0}.exTop small{color:#6d7890}.video{position:relative;padding-top:56.25%;background:#0b1730}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px}.meta>div,.meta label{background:#f5f3ff;padding:10px;border-radius:12px}.meta b{display:block;font-size:10px;color:#6754b5}.meta span{font-weight:800}.meta input{width:100%;border:0;background:transparent;font-weight:800;outline:0}.tip{margin:0 14px 14px;background:#f7f9fc;border-radius:12px;padding:12px;font-size:14px;line-height:1.45}.complete{margin:0 14px 16px;width:calc(100% - 28px);border:0;border-radius:12px;background:#10254a;color:white;padding:14px;font-weight:800}.complete.ok{background:#23845d}.finish{position:fixed;left:0;right:0;bottom:0;padding:12px 16px max(12px,env(safe-area-inset-bottom));background:#fff;box-shadow:0 -4px 18px #10254a18;z-index:6}.finish button{display:block;width:min(728px,100%);margin:auto;border:0;border-radius:14px;padding:15px;background:#6b5bd2;color:#fff;font-weight:900}.summary{display:none;text-align:center;padding:45px 20px}.summary .check{font-size:62px}.summary h2{font-size:28px}.summary button{border:0;border-radius:14px;background:#10254a;color:white;padding:14px 24px;font-weight:800}@media(max-width:520px){.meta{grid-template-columns:1fr 1fr}.meta label{grid-column:1/-1}}</style></head><body><section class="hero"><div class="wrap"><h1>NIELLE FIT</h1><p>Treino de adaptação • 3x por semana</p></div></section><main id="home" class="home wrap"><div class="intro"><h2>Qual é o treino de hoje?</h2><p>Carga leve a moderada. Priorize a execução correta. Descanso: 60–90 segundos.</p></div><div class="workouts"><button class="workoutBtn" onclick="startWorkout('A')"><strong>Treino A</strong><span>Superiores + Core</span><em>Iniciar treino →</em></button><button class="workoutBtn" onclick="startWorkout('B')"><strong>Treino B</strong><span>Inferiores + Glúteos</span><em>Iniciar treino →</em></button><button class="workoutBtn" onclick="startWorkout('C')"><strong>Treino C</strong><span>Corpo todo</span><em>Iniciar treino →</em></button></div></main><section id="session"><div class="sessionHead"><div class="wrap"><div class="sessionRow"><button class="back" onclick="goHome()">←</button><div class="sessionTitle" id="sessionTitle"></div><span id="count">0/5</span></div><div class="progress"><div class="bar" id="bar"></div></div></div></div><div class="content wrap"><div id="exerciseList"></div></div><div class="finish"><button onclick="finishWorkout()">Encerrar treino</button></div></section><section id="summary" class="summary wrap"><div class="check">✓</div><h2>Treino concluído!</h2><p id="summaryText"></p><button onclick="goHome()">Voltar aos treinos</button></section><script>
const W={A:[['Puxada na frente','Costas','2–3','10–12','puxada na frente execução correta português','Peito aberto; puxe para a parte alta do peito e volte devagar.'],['Supino na máquina','Peito','2–3','10–12','qmSOsrheLEg','Costas apoiadas; empurre sem travar os cotovelos e controle a volta.'],['Remada baixa sentada','Costas','2–3','10–12','ldC6IbrxOa4','Coluna neutra; puxe ao abdômen sem balançar o tronco.'],['Elevação lateral','Ombros','2–3','10–12','elevação lateral execução correta português','Carga leve; suba com controle até perto da linha dos ombros.'],['Prancha isométrica','Abdômen','2–3','20–30 s','LxXXhWZgoL8','Contraia abdômen e glúteos e mantenha o corpo alinhado.']],B:[['Leg press 45°','Pernas e glúteos','2–3','10–12','leg press 45 execução correta português','Costas e quadril apoiados; joelhos acompanham os pés e não travam no topo.'],['Cadeira extensora','Quadríceps','2–3','10–12','_ODbNIbo29M','Alinhe o joelho ao eixo da máquina e estenda sem impulso.'],['Cadeira flexora','Posterior de coxa','2–3','10–12','Q5i-dGzEF3Y','Apoio próximo aos tornozelos; flexione sem tirar o quadril do banco.'],['Abdução de quadril','Glúteos','2–3','10–12','abdução quadril máquina execução correta português','Costas apoiadas; abra as pernas sem impulso e retorne lentamente.'],['Panturrilha em pé','Panturrilhas','2–3','12–15','panturrilha em pé execução correta português','Eleve bem os calcanhares, faça breve pausa e desça controlando.']],C:[['Agachamento no Smith','Pernas e glúteos','2–3','10–12','G_uC7h01XRs','Pés firmes e joelhos alinhados; desça mantendo postura estável.'],['Desenvolvimento','Ombros','2–3','10–12','desenvolvimento ombros máquina execução correta português','Costas apoiadas; empurre sem arquear excessivamente a lombar.'],['Puxada alta com triângulo','Costas','2–3','10–12','puxada alta triângulo execução correta português','Peito aberto; puxe o triângulo e controle totalmente a subida.'],['Glúteo na máquina (kickback)','Glúteos','2–3','10–12 cada perna','glúteo máquina kickback execução correta português','Tronco estável; empurre com o quadril sem girar a pelve.'],['Abdominal na máquina ou solo','Abdômen','2–3','12–15','abdominal máquina execução correta português','Use o abdômen; não puxe o pescoço e controle o retorno.']]};const T={A:'Superiores + Core',B:'Inferiores + Glúteos',C:'Corpo todo'};let active=null,started=0;function src(v){return v.length===11&&!v.includes(' ')?'https://www.youtube-nocookie.com/embed/'+v+'?playsinline=1&rel=0':'https://www.youtube-nocookie.com/embed?listType=search&list='+encodeURIComponent(v)}function startWorkout(w){active=w;started=Date.now();home.style.display='none';summary.style.display='none';session.style.display='block';sessionTitle.textContent='Treino '+w+' • '+T[w];exerciseList.innerHTML=W[w].map((x,i)=>`<article class="exercise"><div class="exTop"><span class="num">${i+1}</span><div><h2>${x[0]}</h2><small>${x[1]}</small></div></div><div class="video"><iframe src="${src(x[4])}" title="${x[0]}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="meta"><div><b>SÉRIES</b><span>${x[2]}</span></div><div><b>REPETIÇÕES</b><span>${x[3]}</span></div><label><b>CARGA</b><input inputmode="decimal" placeholder="kg" data-k="${w}-${i}"></label></div><div class="tip"><b>Dica de execução</b><br>${x[5]}</div><button class="complete" onclick="completeExercise(this)">Concluir exercício</button></article>`).join('');document.querySelectorAll('[data-k]').forEach(i=>{i.value=localStorage.getItem('load-'+i.dataset.k)||'';i.onchange=()=>localStorage.setItem('load-'+i.dataset.k,i.value)});update();scrollTo(0,0)}function completeExercise(b){b.classList.toggle('ok');b.textContent=b.classList.contains('ok')?'✓ Concluído':'Concluir exercício';update()}function update(){let d=document.querySelectorAll('.complete.ok').length;count.textContent=d+'/5';bar.style.width=(d*20)+'%'}function finishWorkout(){let d=document.querySelectorAll('.complete.ok').length,m=Math.max(1,Math.round((Date.now()-started)/60000));session.style.display='none';summary.style.display='block';summaryText.textContent='Treino '+active+' • '+d+' de 5 exercícios • '+m+' min';scrollTo(0,0)}function goHome(){session.style.display='none';summary.style.display='none';home.style.display='block';exerciseList.innerHTML='';active=null;scrollTo(0,0)}</script></body></html>
