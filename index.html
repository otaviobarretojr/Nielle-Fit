<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10254a"><title>Nielle Fit</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f5fa;color:#10254a}button,input{font:inherit}.hero{background:linear-gradient(135deg,#071d43,#244b82);color:#fff;padding:28px 18px}.wrap{max-width:760px;margin:auto}.home,.content{padding:18px}.box,.btn,.ex{background:#fff;border-radius:18px;box-shadow:0 5px 18px #10254a12}.box,.btn{padding:18px}.btn{display:block;width:100%;border:0;text-align:left;margin:12px 0;color:#10254a}.btn strong{font-size:22px}.btn span{display:block;color:#68758c}.btn em{display:block;color:#6b5bd2;font-style:normal;font-weight:800;margin-top:8px}#session,#summary{display:none}.top{position:sticky;top:0;z-index:5;background:#f3f5faee;padding:12px 16px}.row{display:flex;gap:10px;align-items:center}.back{border:0;background:#fff;padding:10px;border-radius:10px}.title{font-weight:900;flex:1}.progress{height:8px;background:#dde3ed;border-radius:9px;margin-top:10px;overflow:hidden}.bar{height:100%;background:#6b5bd2;width:0}.ex{overflow:hidden;margin-bottom:15px}.head{display:flex;gap:12px;align-items:center;padding:16px}.num{background:#6b5bd2;color:#fff;padding:8px 12px;border-radius:10px;font-weight:900}.head h2{font-size:19px;margin:0}.head small{color:#6d7890}.video{position:relative;padding-top:56.25%;background:#0b1730}.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px}.meta>*{background:#f5f3ff;padding:10px;border-radius:12px}.meta b{display:block;font-size:10px;color:#6754b5}.meta input{width:100%;border:0;background:transparent;outline:0}.tip,.alt{margin:0 14px 14px;padding:12px;border-radius:12px;font-size:14px}.tip{background:#f7f9fc}.alt{background:#eef7ff;border:1px solid #d8e9f8}.alt b{color:#244b82}.done{margin:0 14px 16px;width:calc(100% - 28px);border:0;border-radius:12px;background:#10254a;color:#fff;padding:14px;font-weight:800}.done.ok{background:#23845d}.finish{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px}.finish button{width:100%;max-width:728px;display:block;margin:auto;border:0;background:#6b5bd2;color:#fff;padding:15px;border-radius:14px;font-weight:900}.content{padding-bottom:90px}.summary{text-align:center;padding:50px 20px}.summary button{border:0;background:#10254a;color:#fff;padding:14px 22px;border-radius:14px}@media(max-width:520px){.meta{grid-template-columns:1fr 1fr}.meta label{grid-column:1/-1}}</style></head><body><section class="hero"><div class="wrap"><h1>NIELLE FIT</h1><p>Treino de adaptação • 3x por semana</p></div></section><main id="home" class="home wrap"><div class="box"><h2>Qual é o treino de hoje?</h2><p>Carga leve a moderada • descanso 60–90 s • prioridade para execução correta.</p></div><button class="btn" onclick="start('A')"><strong>Treino A</strong><span>Superiores + Core</span><em>Iniciar →</em></button><button class="btn" onclick="start('B')"><strong>Treino B</strong><span>Inferiores + Glúteos</span><em>Iniciar →</em></button><button class="btn" onclick="start('C')"><strong>Treino C</strong><span>Corpo todo</span><em>Iniciar →</em></button></main><section id="session"><div class="top"><div class="wrap"><div class="row"><button class="back" onclick="goHome()">←</button><div id="ttl" class="title"></div><span id="cnt">0/5</span></div><div class="progress"><div id="bar" class="bar"></div></div></div></div><div id="list" class="content wrap"></div><div class="finish"><button onclick="finish()">Encerrar treino</button></div></section><section id="summary" class="summary wrap"><div style="font-size:60px">✓</div><h2>Treino concluído!</h2><p id="sum"></p><button onclick="goHome()">Voltar aos treinos</button></section><script>const W={A:[['Puxada na frente','Costas','2–3','10–12','HhPkUk-o3yc','Peito aberto; puxe a barra para a parte alta do peito e controle a volta.','Alternativa: puxada na máquina articulada com pegada neutra. Mantém o padrão de puxada vertical e costuma ser estável para iniciantes.'],['Supino na máquina','Peito','2–3','10–12','qmSOsrheLEg','Costas apoiadas; empurre sem travar os cotovelos.','Alternativa: peck deck/crucifixo na máquina com carga leve, mantendo costas apoiadas.'],['Remada baixa sentada','Costas','2–3','10–12','ldC6IbrxOa4','Coluna neutra; puxe ao abdômen sem balançar o tronco.','Alternativa: remada articulada sentada com apoio para o peito.'],['Elevação lateral','Ombros','2–3','10–12','lj114PlX_Jk','Use carga leve e eleve com controle, sem impulso.','Alternativa: elevação lateral na máquina. Para adaptação, ajuste o banco e comece com carga bem leve.'],['Prancha isométrica','Abdômen','2–3','20–30 s','LxXXhWZgoL8','Contraia abdômen e glúteos mantendo o corpo alinhado.','Alternativa: prancha com os joelhos apoiados no chão, mantendo o tronco alinhado.']],B:[['Leg press 45°','Pernas e glúteos','2–3','10–12','EiltwxxREDc','Mantenha costas e quadril apoiados; não trave os joelhos.',''],['Cadeira extensora','Quadríceps','2–3','10–12','_ODbNIbo29M','Alinhe o joelho ao eixo da máquina e estenda sem impulso.',''],['Cadeira flexora','Posterior de coxa','2–3','10–12','zGwGACoR7kA','Mantenha o quadril apoiado e controle ida e volta.',''],['Abdução de quadril','Glúteos','2–3','10–12','QU-TxDfl6S0','Costas apoiadas; abra sem impulso e retorne lentamente.',''],['Panturrilha em pé','Panturrilhas','2–3','12–15','fVGkOlkOrnA','Suba bem os calcanhares, pause e desça controlando.','']],C:[['Agachamento no Smith','Pernas e glúteos','2–3','10–12','G_uC7h01XRs','Pés firmes, joelhos alinhados e amplitude confortável.',''],['Desenvolvimento','Ombros','2–3','10–12','dwxtc16ACUo','Costas apoiadas; empurre sem arquear excessivamente a lombar.',''],['Puxada alta com triângulo','Costas','2–3','10–12','GjxRBJIOkJk','Peito aberto; puxe o triângulo e controle a subida.',''],['Glúteo na máquina (kickback)','Glúteos','2–3','10–12 cada perna','G_uC7h01XRs','Mantenha tronco e pelve estáveis; mova pelo quadril.',''],['Abdominal na máquina ou solo','Abdômen','2–3','12–15','rSlTGve9n0Y','Faça a flexão com o abdômen e evite puxar o pescoço.','']]};const T={A:'Superiores + Core',B:'Inferiores + Glúteos',C:'Corpo todo'};let a=null,t=0;function start(w){a=w;t=Date.now();home.style.display='none';summary.style.display='none';session.style.display='block';ttl.textContent='Treino '+w+' • '+T[w];list.innerHTML=W[w].map((x,i)=>`<article class="ex"><div class="head"><span class="num">${i+1}</span><div><h2>${x[0]}</h2><small>${x[1]}</small></div></div><div class="video"><iframe src="https://www.youtube.com/embed/${x[4]}?playsinline=1&rel=0" title="${x[0]}" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div><div class="meta"><div><b>SÉRIES</b>${x[2]}</div><div><b>REPETIÇÕES</b>${x[3]}</div><label><b>CARGA</b><input placeholder="kg" data-k="${w}-${i}"></label></div><div class="tip"><b>Dica de execução</b><br>${x[5]}</div>${x[6]?`<div class="alt"><b>↔ Se estiver ocupada / alternativa</b><br>${x[6]}</div>`:''}<button class="done" onclick="done(this)">Concluir exercício</button></article>`).join('');document.querySelectorAll('[data-k]').forEach(i=>{i.value=localStorage.getItem('load-'+i.dataset.k)||'';i.onchange=()=>localStorage.setItem('load-'+i.dataset.k,i.value)});upd();scrollTo(0,0)}function done(b){b.classList.toggle('ok');b.textContent=b.classList.contains('ok')?'✓ Concluído':'Concluir exercício';upd()}function upd(){let d=document.querySelectorAll('.done.ok').length;cnt.textContent=d+'/5';bar.style.width=d*20+'%'}function finish(){let d=document.querySelectorAll('.done.ok').length,m=Math.max(1,Math.round((Date.now()-t)/60000));session.style.display='none';summary.style.display='block';sum.textContent='Treino '+a+' • '+d+' de 5 exercícios • '+m+' min';scrollTo(0,0)}function goHome(){session.style.display='none';summary.style.display='none';home.style.display='block';list.innerHTML='';a=null;scrollTo(0,0)}</script></body></html>
