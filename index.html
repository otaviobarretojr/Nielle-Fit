<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10254a"><title>Nielle Fit</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3f5fa;color:#10254a}button,input{font:inherit}.hero{background:linear-gradient(135deg,#071d43,#244b82);color:#fff;padding:26px 18px}.wrap{max-width:760px;margin:auto}.home,.content{padding:18px}.box,.btn,.ex{background:#fff;border-radius:18px;box-shadow:0 5px 18px #10254a12}.box,.btn{padding:18px}.btn{display:block;width:100%;border:0;text-align:left;margin:12px 0;color:#10254a}.btn strong{font-size:22px}.btn span{display:block;color:#68758c}.btn em{display:block;color:#6b5bd2;font-style:normal;font-weight:800;margin-top:8px}#session,#summary{display:none}.top{position:sticky;top:0;z-index:5;background:#f3f5faee;padding:12px 16px}.row{display:flex;gap:10px;align-items:center}.back{border:0;background:#fff;padding:10px;border-radius:10px}.title{font-weight:900;flex:1}.progress{height:8px;background:#dde3ed;border-radius:9px;margin-top:10px;overflow:hidden}.bar{height:100%;background:#6b5bd2;width:0}.content{padding-bottom:90px}.ex{overflow:hidden;margin-bottom:15px}.head{display:flex;gap:12px;align-items:center;padding:16px}.num{background:#6b5bd2;color:#fff;padding:8px 12px;border-radius:10px;font-weight:900}.head h2{font-size:19px;margin:0}.head small{color:#6d7890}.player{height:230px;background:linear-gradient(145deg,#0b1730,#172e58);color:white;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}.figure{width:110px;height:150px;position:relative;animation:move 2.6s ease-in-out infinite alternate}.headDot{position:absolute;width:28px;height:28px;border-radius:50%;background:#fff;left:41px;top:2px}.bodyLine{position:absolute;width:12px;height:70px;border-radius:8px;background:#fff;left:49px;top:30px}.armL,.armR{position:absolute;width:10px;height:70px;background:#9d8cff;border-radius:8px;top:35px;transform-origin:5px 5px}.armL{left:45px;transform:rotate(55deg)}.armR{right:45px;transform:rotate(-55deg)}.legL,.legR{position:absolute;width:11px;height:60px;background:#fff;border-radius:8px;top:93px}.legL{left:40px;transform:rotate(12deg)}.legR{right:40px;transform:rotate(-12deg)}@keyframes move{to{transform:scale(.96) translateY(8px)}}.playCtl{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px}.speak{border:0;background:#fff;color:#10254a;border-radius:11px;padding:10px 12px;font-weight:800;flex:1}.native{font-size:11px;opacity:.72;align-self:center}.meta{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:14px}.meta>*{background:#f5f3ff;padding:10px;border-radius:12px}.meta b{display:block;font-size:10px;color:#6754b5}.meta input{width:100%;border:0;background:transparent;outline:0}.tip,.alt{margin:0 14px 14px;padding:12px;border-radius:12px;font-size:14px;line-height:1.45}.tip{background:#f7f9fc}.alt{background:#eef7ff;border:1px solid #d8e9f8}.done{margin:0 14px 16px;width:calc(100% - 28px);border:0;border-radius:12px;background:#10254a;color:#fff;padding:14px;font-weight:800}.done.ok{background:#23845d}.finish{position:fixed;bottom:0;left:0;right:0;background:#fff;padding:12px 16px}.finish button{width:100%;max-width:728px;display:block;margin:auto;border:0;background:#6b5bd2;color:#fff;padding:15px;border-radius:14px;font-weight:900}.summary{text-align:center;padding:50px 20px}.summary button{border:0;background:#10254a;color:#fff;padding:14px 22px;border-radius:14px}@media(max-width:520px){.meta{grid-template-columns:1fr 1fr}.meta label{grid-column:1/-1}.player{height:210px}}</style></head><body><section class="hero"><div class="wrap"><h1>NIELLE FIT</h1><p>Treino de adaptação • 3x por semana</p></div></section><main id="home" class="home wrap"><div class="box"><h2>Qual é o treino de hoje?</h2><p>Carga leve a moderada • descanso 60–90 s • prioridade para execução correta.</p></div><button class="btn" onclick="start('A')"><strong>Treino A</strong><span>Superiores + Core</span><em>Iniciar →</em></button><button class="btn" onclick="start('B')"><strong>Treino B</strong><span>Inferiores + Glúteos</span><em>Iniciar →</em></button><button class="btn" onclick="start('C')"><strong>Treino C</strong><span>Corpo todo</span><em>Iniciar →</em></button></main><section id="session"><div class="top"><div class="wrap"><div class="row"><button class="back" onclick="goHome()">←</button><div id="ttl" class="title"></div><span id="cnt">0/5</span></div><div class="progress"><div id="bar" class="bar"></div></div></div></div><div id="list" class="content wrap"></div><div class="finish"><button onclick="finish()">Encerrar treino</button></div></section><section id="summary" class="summary wrap"><div style="font-size:60px">✓</div><h2>Treino concluído!</h2><p id="sum"></p><button onclick="goHome()">Voltar aos treinos</button></section><script>const W={A:[['Puxada na frente','Costas','2–3','10–12','Sente-se com o peito aberto e os pés firmes. Segure a barra um pouco além da largura dos ombros. Puxe a barra em direção à parte alta do peito levando os cotovelos para baixo. Não jogue o tronco para trás. Retorne devagar até estender os braços.','Puxada na máquina articulada com pegada neutra.'],['Supino na máquina','Peito','2–3','10–12','Apoie totalmente as costas. Posicione as mãos na altura do peito. Empurre as alças para frente sem travar os cotovelos. Retorne devagar, mantendo os ombros apoiados.','Peck deck com carga leve.'],['Remada baixa sentada','Costas','2–3','10–12','Mantenha a coluna neutra e o peito aberto. Puxe a alça em direção ao abdômen levando os cotovelos para trás. Evite balançar o tronco e retorne lentamente.','Remada articulada sentada com apoio para o peito.'],['Elevação lateral','Ombros','2–3','10–12','Fique com postura firme e cotovelos levemente flexionados. Eleve os braços para os lados com carga leve até aproximadamente a linha dos ombros. Não encolha os ombros e desça controlando.','Elevação lateral na máquina com carga leve.'],['Prancha isométrica','Abdômen','2–3','20–30 s','Apoie antebraços e pontas dos pés. Contraia abdômen e glúteos. Mantenha cabeça, tronco e quadril alinhados e respire normalmente.','Prancha com os joelhos apoiados.']],B:[['Leg press 45°','Pernas e glúteos','2–3','10–12','Apoie costas e quadril. Posicione os pés firmes na plataforma. Desça controlando e empurre sem travar os joelhos.','Leg press horizontal.'],['Cadeira extensora','Quadríceps','2–3','10–12','Alinhe o joelho ao eixo da máquina. Estenda os joelhos com controle, sem dar impulso, e retorne lentamente.','Extensora unilateral com carga mais leve.'],['Cadeira flexora','Posterior de coxa','2–3','10–12','Mantenha o quadril apoiado. Flexione os joelhos trazendo o apoio para trás e controle completamente a volta.','Mesa flexora.'],['Abdução de quadril','Glúteos','2–3','10–12','Mantenha costas apoiadas. Abra as pernas sem impulso, faça uma pequena pausa e retorne lentamente.','Abdução em pé no cabo com carga leve.'],['Panturrilha em pé','Panturrilhas','2–3','12–15','Eleve os calcanhares o máximo confortável, faça uma pequena pausa no alto e desça lentamente.','Panturrilha sentada.']],C:[['Agachamento no Smith','Pernas e glúteos','2–3','10–12','Posicione os pés firmes. Mantenha joelhos alinhados aos pés. Desça até uma amplitude confortável sem perder a postura e suba controlando.','Agachamento para banco.'],['Desenvolvimento','Ombros','2–3','10–12','Mantenha as costas apoiadas. Empurre as alças acima da cabeça sem arquear a lombar e retorne lentamente.','Desenvolvimento na máquina com carga leve.'],['Puxada alta com triângulo','Costas','2–3','10–12','Mantenha o peito aberto. Puxe o triângulo em direção à parte alta do peito e controle a subida sem deixar os ombros avançarem.','Puxada articulada com pegada neutra.'],['Glúteo na máquina','Glúteos','2–3','10–12 cada perna','Mantenha tronco e pelve estáveis. Empurre usando o quadril, sem girar o corpo nem compensar com a lombar.','Extensão de quadril no cabo com carga leve.'],['Abdominal na máquina ou solo','Abdômen','2–3','12–15','Faça a flexão usando o abdômen. Evite puxar o pescoço. Solte o ar ao contrair e retorne devagar.','Abdominal curto no solo.']]};const T={A:'Superiores + Core',B:'Inferiores + Glúteos',C:'Corpo todo'};let a=null,t=0;function speak(txt){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='pt-BR';u.rate=.9;const vs=speechSynthesis.getVoices(),v=vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('pt-br'))||vs.find(x=>x.lang&&x.lang.toLowerCase().startsWith('pt'));if(v)u.voice=v;speechSynthesis.speak(u)}function start(w){a=w;t=Date.now();home.style.display='none';summary.style.display='none';session.style.display='block';ttl.textContent='Treino '+w+' • '+T[w];list.innerHTML=W[w].map((x,i)=>`<article class="ex"><div class="head"><span class="num">${i+1}</span><div><h2>${x[0]}</h2><small>${x[1]}</small></div></div><div class="player"><div class="figure"><i class="headDot"></i><i class="bodyLine"></i><i class="armL"></i><i class="armR"></i><i class="legL"></i><i class="legR"></i></div><div class="playCtl"><button class="speak" onclick='speak(${JSON.stringify(x[4])})'>🔊 Ouvir execução em português</button><span class="native">player próprio</span></div></div><div class="meta"><div><b>SÉRIES</b>${x[2]}</div><div><b>REPETIÇÕES</b>${x[3]}</div><label><b>CARGA</b><input placeholder="kg" data-k="${w}-${i}"></label></div><div class="tip"><b>Como executar</b><br>${x[4]}</div><div class="alt"><b>↔ Alternativa</b><br>${x[5]}</div><button class="done" onclick="done(this)">Concluir exercício</button></article>`).join('');document.querySelectorAll('[data-k]').forEach(i=>{i.value=localStorage.getItem('load-'+i.dataset.k)||'';i.onchange=()=>localStorage.setItem('load-'+i.dataset.k,i.value)});upd();scrollTo(0,0)}function done(b){b.classList.toggle('ok');b.textContent=b.classList.contains('ok')?'✓ Concluído':'Concluir exercício';upd()}function upd(){let d=document.querySelectorAll('.done.ok').length;cnt.textContent=d+'/5';bar.style.width=d*20+'%'}function finish(){speechSynthesis.cancel();let d=document.querySelectorAll('.done.ok').length,m=Math.max(1,Math.round((Date.now()-t)/60000));session.style.display='none';summary.style.display='block';sum.textContent='Treino '+a+' • '+d+' de 5 exercícios • '+m+' min';scrollTo(0,0)}function goHome(){speechSynthesis.cancel();session.style.display='none';summary.style.display='none';home.style.display='block';list.innerHTML='';a=null;scrollTo(0,0)}</script></body></html>
